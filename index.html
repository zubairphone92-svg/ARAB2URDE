<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اردو ⇄ عربی مترجم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --ink:#13302B; --muted:#5B726D; --line:#D3DFDB;
  --ur:#0F6E5C; --ur-soft:#DCEFE9; --ar:#7A4A12; --ar-soft:#F5E8D4; --rec:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A18; --surface:#16262333; --ink:#E4EFEC; --muted:#93A9A4; --line:#2A3D39;
    --ur:#4FC3A7; --ur-soft:#183A33; --ar:#E2A85A; --ar-soft:#3A2C18; --rec:#F07068;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A18; --surface:#16262333; --ink:#E4EFEC; --muted:#93A9A4; --line:#2A3D39;
  --ur:#4FC3A7; --ur-soft:#183A33; --ar:#E2A85A; --ar-soft:#3A2C18; --rec:#F07068;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Naskh Arabic","Noto Nastaliq Urdu",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
.ur{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",Tahoma,serif;line-height:2.2}
.ar{font-family:"Noto Naskh Arabic",Tahoma,serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:1.35rem;margin:0;font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px}
button:focus-visible{outline:3px solid var(--ur);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}

.mics{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mic{border:none;border-radius:22px;padding:22px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;min-height:150px;transition:transform .12s}
.mic:active{transform:scale(.98)}
.mic .dot{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.mic svg{width:30px;height:30px}
.mic .big{font-size:1.5rem;font-weight:600}
.mic .hint{font-size:.85rem;opacity:.85}
.mic.urb{background:var(--ur)} .mic.arb{background:var(--ar)}
.mic.on{background:var(--rec)}
.mic.on .dot{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.mic.on.metered .dot{animation:none;transition:box-shadow 80ms linear;
  box-shadow:0 0 0 calc(var(--lvl,0) * 20px) rgba(255,255,255,.32)}
.mic .hint.time{direction:ltr;font-variant-numeric:tabular-nums;font-size:1.05rem;opacity:1;font-weight:600}
@media (prefers-reduced-motion:reduce){.mic.on .dot{animation:none}}

.live{min-height:2.4em;margin:14px 4px 4px;color:var(--muted);font-size:1.05rem}
.status{font-size:.9rem;color:var(--muted);margin:0 4px 10px}
.status.err{color:var(--rec)}

.typebox{display:flex;gap:8px;margin:6px 0 22px}
.typebox textarea{flex:1;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;resize:none;overflow:hidden;line-height:1.9}
.typebox textarea.review{border-color:var(--ur);box-shadow:0 0 0 3px var(--ur-soft)}
.review-opt{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:.92rem;color:var(--muted);cursor:pointer}
.review-opt input{width:18px;height:18px;accent-color:var(--ur)}
.editbox textarea{width:100%;font:inherit;font-size:1rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;overflow:hidden;line-height:1.9}
.editbox textarea:focus-visible{outline:3px solid var(--ur);outline-offset:1px}
.editacts{display:flex;gap:6px;margin-top:6px}
.editacts button{font-size:.85rem;padding:4px 12px}
.editacts .primary{background:var(--ur);color:#fff;border-color:var(--ur)}
.typebox select{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 6px}

.voices{display:grid;gap:10px;margin:0 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vlabel{min-width:5.5em;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:4px 16px;background:transparent}
.seg button + button{border-inline-start:1px solid var(--line)}
.vrow[data-code="ur"] .seg button[aria-checked="true"]{background:var(--ur);color:#fff}
.vrow[data-code="ar"] .seg button[aria-checked="true"]{background:var(--ar);color:#fff}
.vsel{flex:1;min-width:9em;max-width:100%;font:inherit;font-size:.85rem;padding:5px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.vtest{font-size:.85rem;padding:4px 10px}
h2{font-size:1.05rem;margin:8px 4px 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.list{display:flex;flex-direction:column;gap:14px}
.empty{color:var(--muted);text-align:center;padding:28px 10px;border:1px dashed var(--line);border-radius:14px}
.entry{border-radius:16px;padding:12px 14px;border:1px solid var(--line);max-width:92%}
.entry.from-ur{background:var(--ur-soft);align-self:flex-start;border-start-start-radius:4px}
.entry.from-ar{background:var(--ar-soft);align-self:flex-end;border-start-end-radius:4px}
.entry .src{color:var(--muted);font-size:.95rem}
.entry .dst{font-size:1.25rem;margin-top:2px}
.entry .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.entry .meta small{color:var(--muted);margin-inline-end:auto}
.entry .meta button{font-size:.82rem;padding:3px 10px;background:transparent}
</style>
</head>
<body>
<main>
  <header>
    <h1>اردو ⇄ عربی مترجم</h1>
    <div class="tools">
      <button id="dlHistory">ہسٹری ڈاؤن لوڈ</button>
      <button id="clearAll">ہسٹری صاف کریں</button>
    </div>
  </header>

  <section class="voices" aria-label="ترجمے کی آواز">
    <div class="vrow" data-code="ur">
      <span class="vlabel">اردو آواز</span>
      <div class="seg" role="radiogroup" aria-label="اردو آواز کی جنس">
        <button type="button" role="radio" data-g="m" aria-checked="false">مرد</button>
        <button type="button" role="radio" data-g="f" aria-checked="false">عورت</button>
      </div>
      <select class="vsel" aria-label="اردو آواز منتخب کریں"></select>
      <button type="button" class="vtest">▶ سنیں</button>
    </div>
    <div class="vrow" data-code="ar">
      <span class="vlabel">عربی آواز</span>
      <div class="seg" role="radiogroup" aria-label="عربی آواز کی جنس">
        <button type="button" role="radio" data-g="m" aria-checked="false">مرد</button>
        <button type="button" role="radio" data-g="f" aria-checked="false">عورت</button>
      </div>
      <select class="vsel" aria-label="عربی آواز منتخب کریں"></select>
      <button type="button" class="vtest">▶ سنیں</button>
    </div>
  </section>

  <div class="mics">
    <button class="mic urb" id="btnUr" aria-pressed="false">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
      <span class="big ur">اردو</span>
      <span class="hint">دبائیں، بولیں، پھر دوبارہ دبائیں</span>
    </button>
    <button class="mic arb" id="btnAr" aria-pressed="false">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
      <span class="big ar">العربية</span>
      <span class="hint ar">اضغط، تكلّم، ثم اضغط مرة أخرى</span>
    </button>
  </div>

  <label class="review-opt"><input type="checkbox" id="reviewToggle"> بولنے کے بعد ترجمے سے پہلے متن دیکھوں اور درست کروں</label>
  <div class="live" id="live" aria-live="polite"></div>
  <div class="status" id="status" role="status"></div>

  <form class="typebox" id="typeForm" onsubmit="return false">
    <select id="typeLang" aria-label="زبان">
      <option value="ur">اردو</option>
      <option value="ar">عربی</option>
    </select>
    <textarea id="typeText" rows="1" placeholder="یا یہاں لکھ کر ترجمہ کریں…" autocomplete="off"></textarea>
    <button id="typeGo" type="button">ترجمہ</button>
  </form>

  <h2>ہسٹری</h2>
  <div class="list" id="list"></div>
</main>

<script>
const LANG = {
  ur:{name:'اردو', sr:['ur-PK','ur-IN','ur'], tts:['ur-PK','ur-IN','ur'], other:'ar', cls:'ur'},
  ar:{name:'عربی', sr:['ar-AE','ar-SA','ar'], tts:['ar-AE','ar-SA','ar-EG','ar'], other:'ur', cls:'ar'}
};
const $ = id => document.getElementById(id);
const statusEl = $('status'), liveEl = $('live'), listEl = $('list');
let sample = null, downloads = null;
let history = [];
const audioBlobs = {};   // id -> Blob (original voice)

function setStatus(msg, err){ statusEl.textContent = msg||''; statusEl.classList.toggle('err', !!err); }

/* ---------- storage ---------- */
function loadHistory(){
  try{ history = JSON.parse(localStorage.getItem('ua-history')||'[]') || []; }catch(e){ history = []; }
}
function saveHistory(){ try{ localStorage.setItem('ua-history', JSON.stringify(history)); }catch(e){} }
let dbp = null;
function idb(){
  if(dbp) return dbp;
  dbp = new Promise((res)=>{
    try{
      const r = indexedDB.open('ua-audio',1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('a');
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> res(null);
    }catch(e){ res(null); }
  });
  return dbp;
}
async function putAudio(id, blob){
  audioBlobs[id] = blob;
  try{ const d = await idb(); if(!d) return; d.transaction('a','readwrite').objectStore('a').put(blob,id); }catch(e){}
}
async function getAudio(id){
  if(audioBlobs[id]) return audioBlobs[id];
  try{
    const d = await idb(); if(!d) return null;
    return await new Promise(res=>{
      const r = d.transaction('a').objectStore('a').get(id);
      r.onsuccess = ()=>{ if(r.result) audioBlobs[id]=r.result; res(r.result||null); };
      r.onerror = ()=> res(null);
    });
  }catch(e){ return null; }
}
async function clearAudio(){ try{ const d = await idb(); if(d) d.transaction('a','readwrite').objectStore('a').clear(); }catch(e){} }

/* ---------- speech synthesis + voice gender ---------- */
// Browsers don't say whether a voice is male or female, so it is guessed from the voice name.
const MALE_NAMES = ['asad','salman','hamed','hamdan','shakir','naayf','taim','omar','rami','moaz','laith',
  'bassel','hedi','jamal','kareem','majed','maged','tarik','tariq','abdullah','hamid','saleh','ammar','zayd',
  'yusuf','ahmed','ahmad','mohammed','muhammad','mohamed','ali','khalid','faisal','sultan','waleed','imran','bilal','usman','hassan','hasan'];
const FEMALE_NAMES = ['uzma','gul','zariyah','fatima','salma','amina','laila','layla','mouna','noura','reem',
  'rana','sana','iman','amany','sara','sarah','hoda','huda','aisha','amal','zeina','mona','dalia','yasmin',
  'nour','lana','hala','sundus','zainab','maryam','mariam','ayesha','hira','sadia','nadia','ayla'];
function guessGender(v){
  const n = (v.name + ' ' + (v.voiceURI||'')).toLowerCase();
  if(/\bfemale\b|\bwoman\b/.test(n)) return 'f';
  if(/\bmale\b|\bman\b/.test(n)) return 'm';
  const words = n.split(/[^a-z]+/);
  if(words.some(w=>FEMALE_NAMES.includes(w))) return 'f';
  if(words.some(w=>MALE_NAMES.includes(w))) return 'm';
  return null;
}
const G_LABEL = {m:'مرد', f:'عورت'};
const SAMPLE = {ur:'السلام علیکم، یہ میری آواز ہے۔', ar:'السلام عليكم، هذا هو صوتي.'};

let vset = {ur:{g:'f', uri:''}, ar:{g:'m', uri:''}};
try{ const saved = JSON.parse(localStorage.getItem('ua-voice')||'null'); if(saved && saved.ur && saved.ar) vset = saved; }catch(e){}
function saveVset(){ try{ localStorage.setItem('ua-voice', JSON.stringify(vset)); }catch(e){} }

let voices = [];
function voicesFor(code){
  const tags = LANG[code].tts.map(t=>t.toLowerCase());
  const rank = v=>{ const l = v.lang.toLowerCase().replace('_','-'); const i = tags.indexOf(l); return i<0 ? tags.length : i; };
  const nat = v=> /natural|online|neural|premium|enhanced/i.test(v.name) ? 0 : 1;
  return voices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(code))
    .sort((a,b)=> nat(a)-nat(b) || rank(a)-rank(b));
}
// returns the voice to use, and a pitch change when no voice of the chosen gender exists
function pickVoice(code){
  const set = vset[code], list = voicesFor(code);
  if(set.uri){
    const v = list.find(v=>v.voiceURI===set.uri);
    if(v) return {voice:v, pitch:1};
  }
  const same = list.find(v=>guessGender(v)===set.g);
  if(same) return {voice:same, pitch:1};
  return {voice:list[0]||null, pitch: set.g==='m' ? 0.72 : 1.3, simulated:true};
}

function renderVoiceUI(){
  document.querySelectorAll('.vrow').forEach(row=>{
    const code = row.dataset.code, set = vset[code];
    row.querySelectorAll('.seg button').forEach(b=> b.setAttribute('aria-checked', String(b.dataset.g===set.g)));
    const sel = row.querySelector('.vsel'), list = voicesFor(code);
    sel.innerHTML = '';
    if(!list.length){
      const o = document.createElement('option'); o.value=''; o.textContent='اس ڈیوائس پر کوئی آواز نہیں ملی';
      sel.appendChild(o); sel.disabled = true; return;
    }
    sel.disabled = false;
    const auto = document.createElement('option'); auto.value='';
    auto.textContent = `خودکار (${G_LABEL[set.g]})`;
    sel.appendChild(auto);
    for(const v of list){
      const g = guessGender(v), o = document.createElement('option');
      o.value = v.voiceURI;
      o.textContent = v.name.replace(/^Microsoft\s+/,'').replace(/\s*-\s*(Urdu|Arabic).*$/i,'') + (g ? ` · ${G_LABEL[g]}` : '');
      sel.appendChild(o);
    }
    sel.value = list.some(v=>v.voiceURI===set.uri) ? set.uri : '';
  });
}
function refreshVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} renderVoiceUI(); }
if('speechSynthesis' in window){
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
  setTimeout(refreshVoices, 800); // some browsers load voices late without firing the event
} else renderVoiceUI();

document.querySelectorAll('.vrow').forEach(row=>{
  const code = row.dataset.code;
  row.querySelectorAll('.seg button').forEach(b=> b.onclick = ()=>{
    vset[code].g = b.dataset.g; vset[code].uri = '';
    saveVset(); renderVoiceUI(); unlockAudio(); speak(SAMPLE[code], code);
  });
  row.querySelector('.vsel').onchange = e=>{
    vset[code].uri = e.target.value;
    const v = voices.find(v=>v.voiceURI===e.target.value);
    const g = v && guessGender(v); if(g) vset[code].g = g;
    saveVset(); renderVoiceUI(); unlockAudio(); speak(SAMPLE[code], code);
  };
  row.querySelector('.vtest').onclick = ()=>{ unlockAudio(); speak(SAMPLE[code], code); };
});

function speak(text, code){
  if(!('speechSynthesis' in window)){ setStatus('یہ براؤزر آواز میں پڑھ کر نہیں سنا سکتا۔', true); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const {voice, pitch} = pickVoice(code);
  u.lang = voice ? voice.lang : LANG[code].tts[0];
  if(voice) u.voice = voice;
  u.pitch = pitch;
  u.rate = 0.95;
  if(!voice) setStatus(`اس ڈیوائس پر ${LANG[code].name} آواز انسٹال نہیں لگتی، آواز درست نہ آئے تو ڈیوائس کی سیٹنگ میں ${LANG[code].name} آواز شامل کریں۔`);
  speechSynthesis.speak(u);
}

/* ---------- translation ---------- */
async function translate(text, from){
  const to = LANG[from].other;
  try{
    const u = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
    const r = await fetch(u); if(!r.ok) throw 0;
    const j = await r.json();
    const out = j[0].map(x=>x[0]).join('').trim();
    if(out) return out;
  }catch(e){}
  const r2 = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
  const j2 = await r2.json();
  const out2 = j2 && j2.responseData && j2.responseData.translatedText;
  if(!out2) throw {message:'انٹرنیٹ کنکشن چیک کریں'};
  return out2.trim();
}

/* ---------- recording + recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IS_EDGE = /Edg\//.test(navigator.userAgent);
const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
let active = null; // current session
let ttsUnlocked = false;

// iOS only lets speech play if it was first started from a tap
function unlockAudio(){
  if(ttsUnlocked) return; ttsUnlocked = true;
  try{
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u);
    }
  }catch(e){}
}
function cancelSpeech(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }

function micError(err){
  const n = err && err.name;
  if(n==='NotAllowedError' || n==='SecurityError')
    return 'مائیکروفون کی اجازت نہیں ملی۔ ایڈریس بار میں 🔒 کے نشان پر جا کر مائیکروفون کی اجازت دیں، پھر صفحہ ری لوڈ کریں۔';
  if(n==='NotFoundError' || n==='OverconstrainedError') return 'اس ڈیوائس پر کوئی مائیکروفون نہیں ملا۔';
  if(n==='NotReadableError' || n==='AbortError') return 'مائیکروفون کسی اور ایپ میں استعمال ہو رہا ہے۔ وہ ایپ بند کر کے دوبارہ کوشش کریں۔';
  return 'مائیکروفون شروع نہیں ہو سکا' + (n ? ': ' + n : '');
}

/* mic stream: recording of the speaker's own voice + level meter */
async function openMic(s){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  s.stream = await navigator.mediaDevices.getUserMedia({
    audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }
  });
  if(window.MediaRecorder){
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac']
      .find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    try{
      s.recorder = new MediaRecorder(s.stream, mime ? {mimeType:mime} : undefined);
      s.recorder.ondataavailable = e => { if(e.data && e.data.size) s.chunks.push(e.data); };
      s.recorder.start(250);
    }catch(e){ s.recorder = null; }
  }
  startMeter(s);
  return true;
}
function startMeter(s){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext; if(!Ctx || !s.stream) return;
    s.ctx = new Ctx();
    if(s.ctx.state === 'suspended') s.ctx.resume().catch(()=>{});
    const an = s.ctx.createAnalyser(); an.fftSize = 512;
    s.ctx.createMediaStreamSource(s.stream).connect(an);
    const data = new Uint8Array(an.fftSize);
    s.btn.classList.add('metered');
    const loop = ()=>{
      an.getByteTimeDomainData(data);
      let sum = 0; for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum += v*v; }
      s.btn.style.setProperty('--lvl', Math.min(Math.sqrt(sum/data.length)*4, 1).toFixed(3));
      s.raf = requestAnimationFrame(loop);
    };
    loop();
  }catch(e){}
}
function closeMic(s){
  if(s.raf) cancelAnimationFrame(s.raf); s.raf = null;
  if(s.ctx){ s.ctx.close().catch(()=>{}); s.ctx = null; }
  if(s.btn){ s.btn.classList.remove('metered'); s.btn.style.removeProperty('--lvl'); }
  if(s.stream){ s.stream.getTracks().forEach(t=>t.stop()); s.stream = null; }
}
// Some phones can't share the mic between recording and recognition:
// give the mic to recognition and continue without the voice recording.
function dropRecording(s){
  if(s.recorder && s.recorder.state !== 'inactive'){ try{ s.recorder.ondataavailable = null; s.recorder.stop(); }catch(e){} }
  s.recorder = null; s.chunks = []; s.audioDropped = true;
  closeMic(s);
}

function showLive(s){
  liveEl.className = 'live ' + LANG[s.code].cls;
  liveEl.textContent = (s.committed + s.sessionFinal + s.interim).trim();
}

function makeRec(s){
  const rec = new SR();
  rec.lang = LANG[s.code].sr[s.langIdx || 0];
  rec.continuous = !IS_ANDROID;   // Android repeats words in continuous mode
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.onstart = ()=>{ s.recRunning = true; };
  rec.onresult = ev=>{
    // rebuild this session's text from scratch (avoids duplicated words)
    let fin = '', interim = '';
    for(let i=0;i<ev.results.length;i++){
      const t = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) fin += t + ' '; else interim += t;
    }
    s.sessionFinal = fin; s.interim = interim;
    showLive(s);
  };
  rec.onerror = ev=>{
    const e = ev.error;
    if(e==='no-speech' || e==='aborted') return;
    if(e==='audio-capture' && s.stream && !s.audioDropped){ dropRecording(s); return; } // retry on next restart
    // language code not accepted: try the next spelling (ur-PK → ur-IN → ur)
    if(e==='language-not-supported' && (s.langIdx||0) < LANG[s.code].sr.length - 1){ s.langIdx = (s.langIdx||0) + 1; return; }
    // some browsers report an unsupported language as a network error: try the next spelling first
    if(e==='network' && (s.langIdx||0) < LANG[s.code].sr.length - 1){ s.langIdx = (s.langIdx||0) + 1; return; }
    s.fatal = true;
    const name = LANG[s.code].name;
    let msg;
    if(e==='not-allowed' || e==='service-not-allowed')
      msg = IS_EDGE
        ? `Edge اس صفحے پر ${name} آواز پہچاننے کی اجازت نہیں دے رہا۔ یہی صفحہ Google Chrome میں کھولیں۔`
        : 'آواز پہچاننے کی اجازت نہیں ملی۔ ایڈریس بار میں 🔒 پر جا کر مائیکروفون کی اجازت دیں۔';
    else if(e==='network')
      msg = IS_EDGE
        ? `Edge ${name} آواز نہیں پہچان پا رہا۔ یہی صفحہ Google Chrome میں کھولیں۔`
        : 'آواز پہچاننے والی سروس سے رابطہ نہیں ہو سکا۔ انٹرنیٹ چیک کریں، VPN یا فائر وال ہو تو بند کر کے آزمائیں۔';
    else if(e==='language-not-supported')
      msg = IS_IOS
        ? `iPhone کا Safari ${name} آواز نہیں پہچانتا۔ نیچے لکھ کر ترجمہ کریں۔`
        : IS_ANDROID
          ? `اس فون پر ${name} آواز پہچاننے کی سہولت نہیں ملی۔ Google ایپ کی سیٹنگ میں Voice → Offline speech recognition میں ${name} شامل کریں۔`
          : `یہ براؤزر ${name} آواز نہیں پہچانتا۔ یہی صفحہ Google Chrome میں کھولیں۔`;
    else if(e==='audio-capture')
      msg = 'مائیکروفون تک رسائی نہیں ہو سکی۔';
    else
      msg = 'آواز پہچاننے میں مسئلہ پیش آیا۔';
    // show the browser's own error code so the cause can be traced
    setStatus(msg + ` (خرابی: ${e} · ${rec.lang})`, true);
    if(active === s) stop();
  };
  rec.onend = ()=>{
    s.recRunning = false;
    s.committed += s.sessionFinal + (s.interim ? s.interim + ' ' : '');
    s.sessionFinal = ''; s.interim = '';
    if(s.recEnded) s.recEnded();
    // keep listening until the user taps the button again
    if(active === s && !s.stopping && !s.fatal){
      setTimeout(()=>{
        if(active !== s || s.stopping) return;
        try{ s.rec = makeRec(s); s.rec.start(); }catch(e){}
      }, IS_ANDROID ? 200 : 60);
    }
  };
  return rec;
}

function fmtClock(ms){ const t = Math.floor(ms/1000); return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); }

async function start(code){
  if(active){ await stop(); return; }
  unlockAudio();
  if(window.isSecureContext === false){
    setStatus('مائیکروفون صرف https:// والے صفحے پر کام کرتا ہے۔ یہ فائل HTTPS سرور سے کھولیں۔', true); return;
  }
  if(!SR){ setStatus('یہ براؤزر بول کر لکھنے کی سہولت نہیں رکھتا۔ Android پر Chrome یا iPhone پر Safari استعمال کریں، یا نیچے لکھ کر ترجمہ کریں۔', true); return; }
  cancelSpeech();
  const btn = code==='ur' ? $('btnUr') : $('btnAr');
  const s = {code, btn, committed:'', sessionFinal:'', interim:'', chunks:[]};

  // ask for the mic first so permission problems get a clear message
  setStatus(code==='ur' ? 'مائیکروفون کھل رہا ہے…' : 'جارٍ فتح الميكروفون…');
  try{ await openMic(s); }
  catch(err){ setStatus(micError(err), true); return; }

  active = s;
  btn.classList.add('on'); btn.setAttribute('aria-pressed','true');
  (code==='ur' ? $('btnAr') : $('btnUr')).disabled = true;
  const hint = btn.querySelector('.hint');
  s.hintText = hint.textContent; hint.classList.add('time');
  s.t0 = Date.now(); hint.textContent = '00:00';
  s.tick = setInterval(()=>{ hint.textContent = fmtClock(Date.now() - s.t0); }, 250);
  if(navigator.vibrate) navigator.vibrate(30);

  liveEl.textContent = '';
  setStatus(code==='ur' ? 'سن رہا ہے… بات ختم کر کے بٹن دوبارہ دبائیں' : 'أستمع… اضغط الزر مرة أخرى عند الانتهاء');
  s.rec = makeRec(s);
  try{ s.rec.start(); }catch(e){}
}

function resetButtons(s){
  clearInterval(s.tick);
  const hint = s.btn.querySelector('.hint');
  hint.classList.remove('time'); hint.textContent = s.hintText;
  for(const b of [$('btnUr'), $('btnAr')]){
    b.classList.remove('on'); b.setAttribute('aria-pressed','false'); b.disabled = false;
  }
}

async function stop(){
  const s = active; if(!s) return;
  s.stopping = true; active = null;
  const ended = new Promise(r=>{
    if(!s.recRunning) return r();
    s.recEnded = r; setTimeout(r, 1500);
  });
  try{ s.rec && s.rec.stop(); }catch(e){}
  const blob = await new Promise(res=>{
    if(!s.recorder || s.recorder.state === 'inactive') return res(null);
    s.recorder.onstop = ()=> res(s.chunks.length ? new Blob(s.chunks, {type: s.recorder.mimeType || 'audio/webm'}) : null);
    try{ s.recorder.stop(); }catch(e){ res(null); }
  });
  closeMic(s);
  resetButtons(s);
  if(navigator.vibrate) navigator.vibrate([20,40,20]);
  await ended;
  const text = (s.committed + s.sessionFinal + s.interim).replace(/\s+/g,' ').trim();
  if(!text){
    if(!s.fatal) setStatus(s.code==='ur' && IS_IOS
      ? 'iPhone کا Safari اردو آواز نہیں پہچانتا۔ نیچے اردو لکھ کر ترجمہ کریں، یا Android فون پر Chrome استعمال کریں۔'
      : 'کوئی بات سنائی نہیں دی، دوبارہ کوشش کریں۔', true);
    liveEl.textContent = ''; return;
  }
  if($('reviewToggle').checked){
    // put the recognised text in the box so it can be corrected before translating
    pending = {blob, code:s.code};
    $('typeLang').value = s.code;
    const ta = $('typeText');
    ta.value = text; ta.classList.add('review');
    setBoxFont(); autoGrow(ta); ta.focus();
    liveEl.textContent = '';
    setStatus('متن کو دیکھ کر درست کریں، پھر "ترجمہ" دبائیں۔');
    return;
  }
  await handleText(text, s.code, blob);
  if(s.audioDropped) setStatus('اس فون پر ترجمہ ہو گیا، لیکن اصل آواز ریکارڈ نہیں ہو سکی۔');
}

async function handleText(text, code, blob){
  setStatus(code==='ur' ? 'ترجمہ ہو رہا ہے…' : 'جارٍ الترجمة…');
  let out;
  try{ out = await translate(text, code); }
  catch(e){
    const c = e && e.code;
    if(c==='rate_limited') setStatus('بہت زیادہ درخواستیں، چند سیکنڈ بعد دوبارہ کوشش کریں۔', true);
    else setStatus('ترجمہ نہیں ہو سکا: ' + ((e && e.message) || ''), true);
    return;
  }
  const id = 'e' + Date.now();
  const entry = {id, from:code, to:LANG[code].other, src:text, dst:out, time:new Date().toISOString(), hasAudio:!!blob};
  if(blob) await putAudio(id, blob);
  history.unshift(entry); saveHistory(); render();
  liveEl.textContent = '';
  setStatus('');
  speak(out, entry.to);
}

/* ---------- render ---------- */
function fmtTime(iso){ try{ return new Date(iso).toLocaleString('ur-PK',{dateStyle:'short',timeStyle:'short'}); }catch(e){ return iso; } }
function render(){
  listEl.innerHTML = '';
  if(!history.length){
    const d = document.createElement('div'); d.className='empty';
    d.textContent = 'ابھی کوئی ترجمہ نہیں۔ اوپر اپنی زبان کا بٹن دبا کر بولیں۔';
    listEl.appendChild(d); return;
  }
  for(const e of history){
    const box = document.createElement('div'); box.className = 'entry from-' + e.from;
    const src = document.createElement('div'); src.className = 'src ' + LANG[e.from].cls; src.textContent = e.src;
    const dst = document.createElement('div'); dst.className = 'dst ' + LANG[e.to].cls; dst.textContent = e.dst;
    const meta = document.createElement('div'); meta.className='meta';
    const t = document.createElement('small'); t.textContent = `${LANG[e.from].name} سے ${LANG[e.to].name} · ${fmtTime(e.time)}` + (e.edited ? ' · درست شدہ' : '');
    const play = document.createElement('button'); play.textContent = '▶ ترجمہ سنیں'; play.onclick = ()=> speak(e.dst, e.to);
    const edit = document.createElement('button'); edit.textContent = '✎ متن درست کریں'; edit.onclick = ()=> startEdit(e, box);
    meta.append(t, play, edit);
    if(e.hasAudio){
      const orig = document.createElement('button'); orig.textContent = '▶ اصل آواز';
      orig.onclick = async ()=>{ const b = await getAudio(e.id); if(!b){ setStatus('یہ آڈیو اب محفوظ نہیں۔', true); return; } const a = new Audio(URL.createObjectURL(b)); a.play(); };
      const dl = document.createElement('button'); dl.textContent = '⬇ آڈیو';
      dl.onclick = ()=> downloadAudio(e);
      meta.append(orig, dl);
    }
    const copy = document.createElement('button'); copy.textContent = 'کاپی';
    copy.onclick = ()=>{ try{ navigator.clipboard.writeText(e.dst); setStatus('کاپی ہو گیا'); }catch(_){} };
    meta.append(copy);
    box.append(src, dst, meta);
    listEl.appendChild(box);
  }
}

/* ---------- downloads ---------- */
async function saveFile(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data],{type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
async function downloadAudio(e){
  const b = await getAudio(e.id);
  if(!b){ setStatus('یہ آڈیو اب محفوظ نہیں۔', true); return; }
  const ext = (b.type||'').includes('mp4') ? 'mp4' : 'webm';
  await saveFile(`${e.from==='ur'?'urdu':'arabic'}-${e.time.slice(0,19).replace(/[:T]/g,'-')}.${ext}`, b);
}
$('dlHistory').onclick = ()=>{
  if(!history.length){ setStatus('ہسٹری خالی ہے۔'); return; }
  const lines = history.slice().reverse().map(e=>
    `[${fmtTime(e.time)}] ${LANG[e.from].name} → ${LANG[e.to].name}\n${e.src}\n${e.dst}\n`);
  saveFile('translation-history.txt', '\uFEFF' + lines.join('\n'));
};
$('clearAll').onclick = async ()=>{
  if(!history.length) return;
  if(!confirm('پوری ہسٹری اور آڈیو حذف کر دیں؟')) return;
  history = []; saveHistory(); await clearAudio(); for(const k in audioBlobs) delete audioBlobs[k]; render(); setStatus('ہسٹری صاف ہو گئی');
};

/* ---------- editing recognised text ---------- */
let pending = null; // recorded voice waiting while the text is reviewed
function autoGrow(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function setBoxFont(){ $('typeText').classList.toggle('ur', $('typeLang').value==='ur'); $('typeText').classList.toggle('ar', $('typeLang').value==='ar'); }

function startEdit(e, box){
  if(box.querySelector('.editbox')) return;
  const src = box.querySelector('.src');
  const wrap = document.createElement('div'); wrap.className = 'editbox';
  const ta = document.createElement('textarea');
  ta.className = LANG[e.from].cls; ta.dir = 'rtl'; ta.rows = 1; ta.value = e.src;
  ta.setAttribute('aria-label', 'اصل متن درست کریں');
  const acts = document.createElement('div'); acts.className = 'editacts';
  const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = 'دوبارہ ترجمہ کریں';
  const cancel = document.createElement('button'); cancel.textContent = 'منسوخ';
  acts.append(ok, cancel); wrap.append(ta, acts);
  src.replaceWith(wrap);
  autoGrow(ta); ta.addEventListener('input', ()=> autoGrow(ta));
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);

  cancel.onclick = ()=> render();
  ok.onclick = async ()=>{
    const v = ta.value.replace(/\s+/g,' ').trim();
    if(!v){ setStatus('متن خالی ہے۔', true); return; }
    if(v === e.src){ render(); speak(e.dst, e.to); return; }
    unlockAudio();
    ok.disabled = cancel.disabled = true; ok.textContent = 'ترجمہ ہو رہا ہے…';
    try{
      const out = await translate(v, e.from);
      e.src = v; e.dst = out; e.edited = true;
      saveHistory(); render();
      setStatus('درست متن کا ترجمہ ہو گیا');
      speak(out, e.to);
    }catch(err){
      ok.disabled = cancel.disabled = false; ok.textContent = 'دوبارہ ترجمہ کریں';
      setStatus('ترجمہ نہیں ہو سکا: ' + ((err && err.message) || ''), true);
    }
  };
  ta.addEventListener('keydown', ev=>{
    if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); ok.click(); }
    else if(ev.key === 'Escape'){ render(); }
  });
}

/* ---------- wiring ---------- */
$('btnUr').onclick = ()=> active ? stop() : start('ur');
$('btnAr').onclick = ()=> active ? stop() : start('ar');
$('typeGo').onclick = ()=>{
  unlockAudio();
  const ta = $('typeText');
  const v = ta.value.replace(/\s+/g,' ').trim(); if(!v) return;
  const code = $('typeLang').value;
  const blob = pending && pending.code === code ? pending.blob : null;
  pending = null;
  ta.value = ''; ta.classList.remove('review'); autoGrow(ta);
  handleText(v, code, blob);
};
$('typeText').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('typeGo').click(); }});
$('typeText').addEventListener('input', e=> autoGrow(e.target));
$('typeLang').addEventListener('change', setBoxFont);
try{ $('reviewToggle').checked = localStorage.getItem('ua-review') === '1'; }catch(e){}
$('reviewToggle').addEventListener('change', e=>{ try{ localStorage.setItem('ua-review', e.target.checked ? '1' : '0'); }catch(_){} });
setBoxFont();

loadHistory(); render();
</script>
</body>
